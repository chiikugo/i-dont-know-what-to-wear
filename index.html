<!doctype html>
<!--
  The app's page. React draws every "page" of the app (home, build, runway,
  closet, about) inside the <div id="root"> below; the address bar's #/… part
  decides which one. See src/main.tsx and src/App.tsx.
  (The Privacy and Terms pages are separate plain-HTML pages in privacy/ and
  terms/; pinterest/callback/index.html is a copy of this page that Pinterest
  returns to after "Connect Pinterest".)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What to Wear</title>
    <meta name="description" content="Pick one piece and build the whole outfit from real runway looks — a taste-learning outfit builder with a runway finish." />
    <meta name="theme-color" content="#f6f1ea" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
